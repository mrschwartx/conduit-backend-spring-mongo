name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conduit-build:
    name: conduit code build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conduit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp -DskipTests verify

  conduit-test:
    name: conduit code tests
    runs-on: ubuntu-latest
    needs: [conduit-build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-backend
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify

  conduit-docker:
    name: conduit docker container
    runs-on: ubuntu-latest
    needs: [conduit-test]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start stack
        run: make docker/up
      - name: Check health endpoint
        run: curl -fsS http://localhost:8080/health
      - name: Check API
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"user":{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}}'
      - name: Check seed
        run: make docker/seed
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps -a
          docker inspect --format '{{json .State.Health}}' conduit-backend
          echo "=== backend logs"
          docker logs conduit-backend 2>&1 | tail -n 100
          echo "=== mongo logs"
          docker logs conduit-mongo 2>&1 | tail -n 30
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
